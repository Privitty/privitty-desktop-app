packages:
  - packages/*
catalog:
  # deltachat specific
  '@privitty/jsonrpc-client': 2.53.0
  '@privitty/stdio-rpc-server': 2.53.0

  # dependencies
  '@types/mime-types': ^2.1.4
  '@types/node': ^20.14.13
  '@webxdc/types': ^2.1.2
  'calls-webapp': 'github:deltachat/calls-webapp#build-for-deltachat-desktop'
  mime-types: ^2.1.35

  # tools / dev dependencies
  sass: ^1.86.3
  typescript: ^7.0.2
  typescript-plugin-css-modules: ^5.2.0

onlyBuiltDependencies:
  - '@parcel/watcher'
  - electron
  - esbuild

overrides:
  'glob@>=10.0.0 <10.5.0': 10.5.0
  js-yaml: '>=4.1.1'
  lodash: '>=4.17.23'
  'minimatch@>=9.0.0 <10.2.1': 10.2.1
  qs: '>=6.14.2'
  tar: '>=7.5.8'

peerDependencyRules:
  allowedVersions:
    '@emoji-mart/react>react': '19'

# pnpm 10+ reads these from pnpm-workspace.yaml (not package.json "pnpm").
supportedArchitectures:
  cpu:
    - x64
    - ia32
    - arm64
  os:
    - darwin
    - win32
    - linux
